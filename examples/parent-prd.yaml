header:
  schema-version: "0.1.0"
  version: "0.1.0"
  last-updated: "2026-01-01"

slug: my-feature
title: "My Feature"
features:
  - "org/repo#99"
description: >-
  One paragraph describing what this initiative is and why it exists.

stakeholders:
  - role: "Product Owner"
    handle: "@handle"
  - role: "Requestor"
    handle: "@handle"
    approver: true
  - role: "Stakeholder Representative"
    handle: "@handle"

job-executors:
  - id: example-executor
    label: "Example Executor"
    core-job: "accomplish the core job this initiative serves, in its context"

desired-outcomes:
  - id: DO-MF-001
    statement: "minimize the time it takes to <accomplish a step of the job> so <context>"
    executor-id: example-executor

scope:
  in-scope:
    - "Thing we are building"
  out-of-scope:
    - "Thing we are not building"

nonfunctional-requirements:
  - id: NFR-MF-001
    title: "Example NFR"
    description: >-
      Describe the non-functional requirement here.

open-questions:
  - question: >-
      An open question that needs resolution before or during delivery.
