header:
  schema-version: "0.3.0"
  version: "1.0.0"
  last-updated: "2026-11-13"
slug: structured
title: Structured example
description: Maintain requirements that reviewers can understand without a meeting.
lifecycle:
  diagram: |
    stateDiagram-v2
      Draft --> Ready: Full council and author confirmation
      Ready --> Approved: Human sign-off
  description: |
    **Draft** permits incomplete acceptance criteria. A full council review
    and author confirmation advance the phase to Ready.
reading-guide: |
  Start with the overview, then read the [maintenance phase](structured-phase.yaml).
glossary:
  - term: Allocation
    definition: A recorded link between a feature and the FRs that deliver it.
nonfunctional-requirements:
  - id: NFR-MF-001
    title: Readable without a meeting
    description: Reviewers can identify each requirement's purpose from the PRD.
job-executors:
  - id: owner
    label: Owner
    core-job: Maintain content
features: [FEATURE-1]
feature-mappings:
  - feature: FEATURE-1
    fr-ids: [FR-MFP-001]
    allocation-status: unconfirmed
    evidence: "Recorded journey; allocation needs confirmation."
open-questions:
  - question: Who approves processing?
    decision:
      id: DEC-MF-001
      status: Open
      blocks: []
      authority:
        status: unconfirmed
        description: Source owner; contact unconfirmed.
